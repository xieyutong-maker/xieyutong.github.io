<!DOCTYPE html>
<html>
<head>
    <meta http-equiv="Content-Type" content="text/html;charset=utf-8">
    <title>Task d: Different Colors for Triangle and Square</title>
    <script id="vertex-shader" type="x-shader/x-vertex">
        #version 300 es
        in vec4 aPosition;
        in vec4 aColor;
        out vec4 vColor;
        void main(){
            gl_Position = aPosition;
            vColor = aColor;
        }
    </script>
    <script id="fragment-shader" type="x-shader/x-fragment">
        #version 300 es
        precision mediump float;
        in vec4 vColor;
        out vec4 fColor;
        void main(){
            fColor = vColor;
        }
    </script>
    <script type="text/javascript" src="../js/common/webgl-utils.js"></script>
    <script type="text/javascript" src="../js/common/initShaders.js"></script>
    <script type="text/javascript" src="../js/common/glMatrix-0.9.5.min.js"></script>
    <script type="text/javascript" src="../js/ch01/trisquare-different-colors.js"></script>
</head>
<body>
    <canvas id="trisquare-canvas" style="border:none;" width="500" height="500"></canvas>
    <p>任务d：绿色三角形 + 蓝色四边形</p>
</body>
</html>
