<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>任务b - 绘制四边形</title>
    <script id="vertex-shader" type="x-shader/x-vertex">
        #version 300 es
        in vec4 vPosition;
        void main() {
            gl_Position = vPosition;
        }
    </script>
    <script id="fragment-shader" type="x-shader/x-fragment">
        #version 300 es
        precision mediump float;
        uniform vec4 uColor;
        out vec4 fColor;
        void main() {
            fColor = uColor;
        }
    </script>
    <script src="common/webgl-utils.js"></script>
    <script src="common/initShaders.js"></script>
    <script src="js/task-b.js"></script>
    <style>body { font-family: Arial; margin: 40px; } canvas { border: 2px solid #333; } button { margin: 5px; padding: 10px; }</style>
</head>
<body>
    <h1>任务b：绘制四边形（非红色）</h1>
    <a href="index.html">返回首页</a>
    <canvas id="task-b-canvas" width="500" height="500"></canvas>
    <div>
        <button onclick="changeColor('blue')">蓝色四边形</button>
        <button onclick="changeColor('green')">绿色四边形</button>
        <button onclick="changeColor('purple')">紫色四边形</button>
    </div>
</body>
</html>
