<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>任务c - 相同颜色的图形</title>
    <script id="vertex-shader" type="x-shader/x-vertex">
        #version 300 es
        in vec4 vPosition;
        void main() {
            gl_Position = vPosition;
        }
    </script>
    <script id="fragment-shader" type="x-shader/x-fragment">
        #version 300 es
        precision mediump float;
        uniform vec4 uColor;
        out vec4 fColor;
        void main() {
            fColor = uColor;
        }
    </script>
    <script src="common/webgl-utils.js"></script>
    <script src="common/initShaders.js"></script>
    <script src="js/task-c.js"></script>
    <style>body { font-family: Arial; margin: 40px; } canvas { border: 2px solid #333; } button { margin: 5px; padding: 10px; }</style>
</head>
<body>
    <h1>任务c：相同颜色的三角形和四边形</h1>
    <a href="index.html">返回首页</a>
    <canvas id="task-c-canvas" width="500" height="500"></canvas>
    <div>
        <button onclick="changeColor('orange')">橙色</button>
        <button onclick="changeColor('teal')">青色</button>
        <button onclick="changeColor('brown')">棕色</button>
    </div>
</body>
</html>
